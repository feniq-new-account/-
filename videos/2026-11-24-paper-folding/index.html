<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0a0c14;
        --ink: #ffffff;
        --accent: #ffb84d;
        --font-display: "Inter", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--font-display);
      }
      #bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 900px 1100px at 50% 40%, #161d33 0%, #0d1120 55%, #07080e 100%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="48.09" data-width="1080" data-height="1920">
      <div id="bg"></div>
      <div id="sim" data-composition-id="sim" data-composition-src="compositions/sim.html" data-start="0" data-duration="48.09" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <audio id="voice" class="clip" src="assets/voice.wav" data-start="0" data-duration="48.09" data-track-index="2" data-volume="0.8"></audio>

      <!-- whoosh on each camera pull-back; pops on the first folds -->

      <audio id="sfx-w6" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="21.30" data-duration="0.57" data-track-index="3" data-volume="0.22"></audio>

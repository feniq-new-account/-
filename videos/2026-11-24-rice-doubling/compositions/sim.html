        [34, "Fills a whole house"], [37, "Fills an Olympic pool"], [47, "Bigger than the Great Pyramid"],
        [58, "Manhattan, 40 stories deep"], [74, "The whole planet, 1 m deep"], [95, "Bigger than Earth"],
        [106, "Bigger than Jupiter"], [116, "Bigger than the Sun"], [117, "≈ 3.5 Suns"], [118, "≈ 7 Suns"],
        [119, "≈ 14 Suns"], [120, "≈ 28 Suns"],
      ].map(([t, s]) => ({ t, s, v: t === 0 ? 0 : vOf(t) }));

      const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
      const sup = (n) => String(n).split("").map((c) => SUP[+c]).join("");
      const commas = (s) => s.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      const NAMES = ["", "thousand", "million", "billion", "trillion", "quadrillion", "quintillion", "sextillion", "septillion", "octillion", "nonillion", "decillion", "undecillion"];
      function fmtSig(x, sig) {
        const p = Math.pow(10, Math.floor(Math.log10(x)) - sig + 1);
        const r = Math.round(x / p) * p;
        return r >= 100 ? String(Math.round(r)) : r.toPrecision(sig).replace(/\.?0+$/, (m) => (m.startsWith(".") ? "" : m));
      }
      function fmtVol(n) {
        const cm3 = 0.03 * Math.pow(2, n);
        if (cm3 < 1000) return (cm3 < 10 ? cm3.toFixed(2).replace(/0$/, "") : fmtSig(cm3, 2)) + " cm³";
        if (cm3 < 1e6) return fmtSig(cm3 / 1000, 3) + " liters";
        const m3 = cm3 / 1e6;
        if (m3 < 1e6) return commas(String(Math.round(m3))) + " m³";
        if (m3 < 1e9) return fmtSig(m3 / 1e6, 2) + " million m³";
        if (m3 < 1e12) return fmtSig(m3 / 1e9, 2) + " billion m³";
        let e = Math.floor(Math.log10(m3)), mm = (m3 / Math.pow(10, e)).toFixed(1);
        if (mm === "10.0") { mm = "1.0"; e += 1; }
        return mm + " × 10" + sup(e) + " m³";
      }

      // ---- static generated art (seeded, built once) ----
      const g0 = $("sim-grains0");
      for (let i = 0; i < 128; i++) {
        const r = 14 * Math.sqrt(i), a = i * 2.39996;
        const x = C.x + r * Math.cos(a), y = C.y + r * Math.sin(a) * 0.8;
        const e = document.createElementNS(NS, "ellipse");
        e.setAttribute("cx", x.toFixed(1)); e.setAttribute("cy", y.toFixed(1));
        e.setAttribute("rx", i === 0 ? 13 : 11); e.setAttribute("ry", i === 0 ? 5 : 4.4);
        e.setAttribute("fill", "url(#sim-grain-g)");
        e.setAttribute("stroke", "#b8a37a"); e.setAttribute("stroke-width", "0.6");
        e.setAttribute("transform", `rotate(${i === 0 ? -22 : Math.round(rnd() * 180)} ${x.toFixed(1)} ${y.toFixed(1)})`);
        e.setAttribute("opacity", "0");
        g0.appendChild(e);
      }
      const grains = Array.from(g0.children);

      const fl = $("sim-flagset5");
      for (let x = 205; x < 880; x += 30) {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", `M${x} 512 l15 0 l-7.5 16 Z`);
        p.setAttribute("fill", ["#ff6b6b", "#ffd166", "#4cc9f0"][((x - 205) / 30) % 3]);
        fl.appendChild(p);
      }

      const city = $("sim-city7");
      const H = [70, 150, 95, 230, 120, 330, 160, 443, 110, 260, 85, 541, 190, 135, 290, 75, 210, 100];
      const PXM = 0.66; // px per metre
      let cx = 130;
      H.forEach((h, i) => {
        const w = 38 + Math.round(rnd() * 22);
        const top = 832 - h * PXM;
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", cx); r.setAttribute("y", top.toFixed(1)); r.setAttribute("width", w); r.setAttribute("height", (h * PXM).toFixed(1));
        r.setAttribute("fill", i % 2 ? "#171e31" : "#1b2338"); r.setAttribute("stroke", "#7d89b0"); r.setAttribute("stroke-width", "3");
        city.appendChild(r);
        if (h === 541 || h === 443) {
          const s = document.createElementNS(NS, "line");
          s.setAttribute("x1", cx + w / 2); s.setAttribute("x2", cx + w / 2); s.setAttribute("y1", top); s.setAttribute("y2", top - 30);
          s.setAttribute("stroke", "#7d89b0"); s.setAttribute("stroke-width", "3"); city.appendChild(s);
        }
        for (let yy = top + 10; yy < 820; yy += 18) {
          for (let xx = cx + 7; xx < cx + w - 8; xx += 12) {
            if (rnd() < 0.38) {
              const wdw = document.createElementNS(NS, "rect");
              wdw.setAttribute("x", xx); wdw.setAttribute("y", yy.toFixed(1)); wdw.setAttribute("width", 5); wdw.setAttribute("height", 7);
              wdw.setAttribute("fill", "#ffcf73"); wdw.setAttribute("opacity", (0.35 + rnd() * 0.5).toFixed(2));
              city.appendChild(wdw);
            }
          }
        }
        cx += w + 2;
      });

      const stars = $("sim-stars8");
      for (let i = 0; i < 110; i++) {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", (rnd() * 1080).toFixed(0)); c.setAttribute("cy", (120 + rnd() * 700).toFixed(0));
        c.setAttribute("r", (0.8 + rnd() * 2).toFixed(1)); c.setAttribute("fill", "#cfd8ff"); c.setAttribute("opacity", (0.25 + rnd() * 0.6).toFixed(2));
        stars.appendChild(c);
      }

      const TICKS = [10, 14, 23, 30, 34, 37, 47, 58, 74, 95, 116];
      const tk = $("sim-ticks");
      TICKS.forEach((x) => { const i = document.createElement("i"); i.style.left = ((x / 120) * 740).toFixed(1) + "px"; tk.appendChild(i); });
      const tickEls = Array.from(tk.children);

      // ---- per-frame drawing: everything is a function of v alone ----
      const ST = [0, 1, 2, 3, 4, 5, 6, 7, 8].map((k) => $("sim-st" + k));
      const S = 5;
      const box = { // container fill geometry: bottom y, full height, heap top y, heap half-width
        1: [680, 170, 510, 180], 2: [700, 200, 494, 250], 3: [814, 448, 366, 310], 4: [817, 425, 560, 280], 5: [737, 137, 600, 380],
      };
      const R_EARTH_PX = 165, V_EARTH = 1.083e21, R_JUP = 10.97, R_SUN = 109.1;

      function setFill(k, f) {
        const [yb, h, top, hw] = box[k];
        const fill = $("sim-fill" + k), heap = $("sim-heap" + k);
        const lvl = k === 4 ? Math.min(f, 1) : Math.min(f, 1);
        const y = yb - h * lvl;
        fill.setAttribute("y", y.toFixed(1)); fill.setAttribute("height", (yb - y + 10).toFixed(1));
        let L = f > 1 ? Math.log2(f) : 0;
        if (k === 1) L = f > 0.8 ? (f - 0.8) * 2.5 + (f > 1 ? Math.log2(f) : 0) : 0; // a full bowl is heaped
        const rx = hw * (1 + 0.04 * Math.min(L, 4)), ry = Math.min(16 * L, k === 1 ? 80 : 70);
        heap.setAttribute("d", ry < 0.5 ? "" : `M${(540 - rx).toFixed(1)} ${top + 4} A${rx.toFixed(1)} ${ry.toFixed(1)} 0 0 1 ${(540 + rx).toFixed(1)} ${top + 4} Z`);
      }

      function render(v) {
        const t = simT(v);
        const n = Math.floor(t + 1e-9);
        const z = zOf(v);

        // stages: zoom-out = the old world shrinks, the new one arrives from large
        for (let k = 0; k <= 8; k++) {
          const d = z - k;
          const vis = d > -1 && d < 1.15 && !(k === 8 && false);
          ST[k].style.display = vis || (k === 8 && d >= 0) ? "" : "none";
          if (!(vis || (k === 8 && d >= 0))) continue;
          const sc = Math.pow(S, -Math.min(d, 1.15));
          const op = d < 0 ? Math.pow(clamp(1 + d), 1.6) : k === 8 ? 1 : clamp(1 - d * 1.25);
          ST[k].setAttribute("transform", `translate(${C.x} ${C.y}) scale(${sc.toFixed(5)}) translate(${-C.x} ${-C.y})`);
          ST[k].setAttribute("opacity", op.toFixed(3));
        }

        // 0 · grains pile up, the inner camera pulls back as they double
        const Nc = Math.pow(2, t);
        const shown = Math.min(Math.pow(2, n), 128);
        grains.forEach((e, i) => e.setAttribute("opacity", i < shown ? "1" : "0"));
        const k0 = clamp(150 / (14 * Math.sqrt(Math.min(Nc, 1e6)) + 10), 0.05, 6.2);
        $("sim-st0-in").setAttribute("transform", `translate(${C.x} ${C.y}) scale(${k0.toFixed(4)}) translate(${-C.x} ${-C.y})`);
        const mr = 14 * Math.sqrt(Nc) + 8;
        const m = $("sim-mound0");
        const mb = C.y + mr * 0.45;
        m.setAttribute("d", `M${(C.x - mr * 1.15).toFixed(1)} ${mb.toFixed(1)} A${(mr * 1.15).toFixed(1)} ${(mr * 1.05).toFixed(1)} 0 0 1 ${(C.x + mr * 1.15).toFixed(1)} ${mb.toFixed(1)} Z`);
        m.setAttribute("opacity", clamp((t - 6.3) / 1.5).toFixed(3));

        // 1–5 · containers fill by volume: f = V / capacity = 2^(t − t_full)
        for (let k = 1; k <= 5; k++) setFill(k, Math.pow(2, t - STAGE_T[k]));

        // 6 · pyramid: fill height for a volume fraction, then a cone of rice buries it
        {
          const f = Math.pow(2, t - 47);
          const hf = 1 - Math.pow(1 - Math.min(f, 1), 1 / 3);
          const y = 818 - 366 * hf;
          $("sim-fill6").setAttribute("y", y.toFixed(1)); $("sim-fill6").setAttribute("height", (818 - y + 10).toFixed(1));
          const s = f > 1 ? Math.min(Math.cbrt(f), 1.25) : 0;
          $("sim-heap6").setAttribute("points", `${540 - 290 * s},820 540,${820 - 380 * s} ${540 + 290 * s},820`);
        }

        // 7 · Manhattan: depth = 146 m × 2^(t − 58)
        {
          const depth = 146 * Math.pow(2, t - 58);
          const y = 832 - Math.min(depth * PXM, 430);
          $("sim-fill7").setAttribute("d", `M90 840 L90 ${(y + 6).toFixed(1)} Q300 ${(y - 8).toFixed(1)} 540 ${y.toFixed(1)} T990 ${(y + 4).toFixed(1)} L990 840 Z`);
        }

        // 8 · space, everything in Earth radii, concentric
        {
          const Vr = 0.03e-6 * Math.pow(2, t);
          let rBall = Math.cbrt(1 + Vr / V_EARTH);
          const outro = 1 - 0.42 * ease(clamp((v - 42.7) / 1.1));
          const P = Math.min(R_EARTH_PX, 205 / rBall) * outro;
          const coatMin = 7 * clamp((t - 71) / 3);
          const ballPx = Math.max(rBall * P, P + coatMin);
          const cy = C.y + 45 + 55 * ease(clamp((v - 42.7) / 1.1));
          for (const id of ["sim-ball8", "sim-balltex8", "sim-sunring8", "sim-jup8", "sim-sun8"]) $(id).setAttribute("cy", cy.toFixed(1));
          $("sim-ball8").setAttribute("r", ballPx.toFixed(2));
          $("sim-balltex8").setAttribute("r", ballPx.toFixed(2));
          $("sim-earth8").setAttribute("transform", `translate(540 ${cy.toFixed(1)}) scale(${P.toFixed(4)})`);
          const rJ = R_JUP * P, rS = R_SUN * P;
          $("sim-jup8").setAttribute("r", rJ.toFixed(1));
          $("sim-jup8").setAttribute("opacity", (rJ < 1500 ? clamp((t - 97) / 2) * (1 - clamp((t - 106.5) / 1.2)) : 0).toFixed(3));
          const inside = clamp((ballPx - rS) / (0.12 * ballPx));
          $("sim-sunring8").setAttribute("r", rS.toFixed(1));
          $("sim-sunring8").setAttribute("opacity", (rS < 3000 ? 0.8 * clamp((t - 104) / 3) * (1 - inside) : 0).toFixed(3));
          $("sim-sun8").setAttribute("r", rS.toFixed(1));
          $("sim-sun8").setAttribute("opacity", (inside * 0.95).toFixed(3));
          const el = $("sim-earthlbl8");
          el.setAttribute("x", (540 + ballPx + 22).toFixed(1)); el.setAttribute("y", (cy + 10).toFixed(1));
          el.setAttribute("opacity", (1 - clamp((t - 96) / 1.5)).toFixed(3));
          const jl = $("sim-juplbl8");
          jl.setAttribute("y", (cy - rJ - 16).toFixed(1));
          jl.setAttribute("opacity", (rJ > ballPx + 20 && cy - rJ - 16 > 380 ? clamp((t - 99) / 1.5) : 0).toFixed(3));
          const sl = $("sim-sunlbl8");
          if (inside > 0.5) { sl.setAttribute("y", (cy + 12).toFixed(1)); sl.setAttribute("fill", "#5a2a00"); }
          else { sl.setAttribute("y", (cy - rS - 16).toFixed(1)); sl.setAttribute("fill", "#ffb547"); }
          sl.setAttribute("opacity", (inside > 0.5 ? clamp((inside - 0.5) * 2) : cy - rS - 16 > 380 ? clamp((t - 110) / 1.5) : 0).toFixed(3));
        }

        // ---- counter: exact 2^n ----
        const N = 2n ** BigInt(n);
        const ds = N.toString();
        const numEl = $("sim-num"), nameEl = $("sim-name");
        const vStep = n === 0 ? 0 : vOf(n);
        const gap = n === 0 ? 1 : vOf(n) - vOf(n - 1);
        const bump = gap > 0.25 ? 1 + 0.07 * (1 - eout(clamp((v - vStep) / 0.18))) : 1;
        if (ds.length <= 12) {
          const s = commas(ds);
          const commasN = (s.match(/,/g) || []).length;
          const fs = Math.min(230, 680 / (ds.length * 0.44 + commasN * 0.2));
          numEl.textContent = s; numEl.style.fontSize = fs.toFixed(1) + "px";
          nameEl.textContent = ""; nameEl.style.display = "none";
          $("sim-digits").textContent = "";
        } else {
          const k = Math.floor((ds.length - 1) / 3);
          const lead = ds.length - 3 * k;
          const mant = lead === 3 ? ds.slice(0, 3) : ds.slice(0, lead) + "." + ds.slice(lead, 3);
          numEl.textContent = mant; numEl.style.fontSize = "158px";
          nameEl.textContent = NAMES[k].toUpperCase(); nameEl.style.display = "";
          $("sim-digits").textContent = commas(ds).replace(/,/g, ",\u200b");
        }
        numEl.style.transform = `scale(${bump.toFixed(4)})`;
        $("sim-pow").textContent = "2" + sup(n);

        // comparison line: the latest reference passed; it blurs in on arrival
        let c = CMP[0];
        for (const x of CMP) if (n >= x.t) c = x;
        const cmp = $("sim-cmp");
        cmp.textContent = c.s;
        const a = clamp((v - c.v) / 0.2);
        cmp.style.opacity = c.t === 0 ? "1" : (0.15 + 0.85 * a).toFixed(3);
        cmp.style.filter = c.t === 0 ? "none" : `blur(${(8 * (1 - a)).toFixed(2)}px)`;
        cmp.style.fontSize = (c.s.length > 24 ? 36 : c.s.length > 19 ? 40 : 44) + "px";
        $("sim-vol").textContent = fmtVol(n);

        // progress track (sim seconds out of 120)
        const px = ((t / 120) * 740).toFixed(1);
        $("sim-track-fill").style.width = px + "px";
        $("sim-track-dot").style.left = px + "px";
        tickEls.forEach((e, i) => (e.className = n >= TICKS[i] ? "on" : ""));

        // clock
        $("sim-clock-num").textContent = String(n);
        $("sim-clock-hand").setAttribute("transform", `rotate(${((t % 60) * 6).toFixed(1)} 17 17)`);
      }

      // ---- timeline: a driver tween for the full length + titles ----
      const tl = gsap.timeline({ paused: true });
      const drv = { p: 0 };
      tl.to(drv, { p: 1, duration: D, ease: "none" }, 0);
      tl.eventCallback("onUpdate", () => render(tl.time()));

      // hook on frame 0, out at 3.2 s; clock in
      tl.fromTo("#sim-hook", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power3.in" }, 3.15);
      tl.fromTo("#sim-clock-pill", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 3.35);
      tl.to("#sim-clock-pill", { opacity: 0, duration: 0.2, ease: "power2.in" }, 42.55);
      // outro lines on their words
      const outs = [["#sim-out1", 42.95, 44.15], ["#sim-out2", 44.26, 45.8], ["#sim-out3", 45.93, D + 1]];
      outs.forEach(([sel, a, b]) => {
        tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, a);
        if (b < D) tl.to(sel, { opacity: 0, filter: "blur(6px)", duration: 0.13, ease: "power2.in" }, b - 0.13);
      });

      render(0);
      window.__timelines["sim"] = tl;
    })();
  </script>
</template>

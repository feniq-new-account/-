<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0a0c14;
        --ink: #ffffff;
        --accent: #ffb84d;
        --font-display: "Inter", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--font-display);
      }
      #bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 900px 1100px at 50% 40%, #161d33 0%, #0d1120 55%, #07080e 100%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="49.12" data-width="1080" data-height="1920">
      <div id="bg"></div>
      <div id="sim" data-composition-id="sim" data-composition-src="compositions/sim.html" data-start="0" data-duration="49.12" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <audio id="voice" class="clip" src="assets/voice.wav" data-start="0" data-duration="49.12" data-track-index="2" data-volume="0.8"></audio>

      <!-- whooshes on the camera pull-backs; pops on the first amounts -->
      <audio id="sfx-w1" class="clip" src="assets/sfx/whoosh.mp3" data-start="12.00" data-duration="0.57" data-track-index="3" data-volume="0.28"></audio>
      <audio id="sfx-w2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="16.99" data-duration="0.57" data-track-index="3" data-volume="0.24"></audio>
      <audio id="sfx-w3" class="clip" src="assets/sfx/whoosh.mp3" data-start="19.63" data-duration="0.57" data-track-index="3" data-volume="0.3"></audio>
      <audio id="sfx-w4" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="22.57" data-duration="0.57" data-track-index="3" data-volume="0.24"></audio>
      <audio id="sfx-w5" class="clip" src="assets/sfx/whoosh.mp3" data-start="27.46" data-duration="0.57" data-track-index="3" data-volume="0.3"></audio>
      <audio id="sfx-w6" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="32.02" data-duration="0.57" data-track-index="3" data-volume="0.26"></audio>
      <audio id="sfx-p1" class="clip" src="assets/sfx/pop.mp3" data-start="7.51" data-duration="0.72" data-track-index="5" data-volume="0.32"></audio>
      <audio id="sfx-p2" class="clip" src="assets/sfx/pop.mp3" data-start="9.53" data-duration="0.72" data-track-index="5" data-volume="0.32"></audio>
      <audio id="sfx-p3" class="clip" src="assets/sfx/pop.mp3" data-start="13.68" data-duration="0.72" data-track-index="5" data-volume="0.32"></audio>
      <!-- riser cresting on "five point three seven million", bass hit on the landing -->
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="34.53" data-duration="6" data-track-index="4" data-volume="0.22" data-fade-out="1.2"></audio>
      <audio id="sfx-hit" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="37.93" data-duration="2.11" data-track-index="6" data-volume="0.4"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
